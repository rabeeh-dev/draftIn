<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="draftin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <linearGradient id="feather-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="vane-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="spine-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#draftin-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Brand Feather Icon -->
  <g transform="translate(4, 4)">
    <!-- Feather body translucent fill for depth -->
    <path
      d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z"
      fill="url(#vane-fill)"
    />
    <!-- Feather outer contour -->
    <path
      d="M14.086 18.412A2 2 0 0112.67 19H5v-7.672a2 2 0 01.586-1.414L11.75 3.75a6 6 0 118.49 8.49z"
      stroke="url(#feather-stroke)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Feather central spine / quill line -->
    <path
      d="M16 8L2 22"
      stroke="url(#spine-stroke)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Feather horizontal barb cut -->
    <path
      d="M17.488 15H9"
      stroke="#BAE6FD"
      stroke-width="1.75"
      stroke-linecap="round"
    />
    <!-- Glowing nib writing point at quill tip -->
    <circle cx="2" cy="22" r="1.25" fill="#38BDF8"/>
  </g>
</svg>
